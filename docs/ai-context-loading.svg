<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowDash" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b25400"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="380" fill="#ffffff"/>

  <!-- ===================== EDGES ===================== -->
  <!-- Agent -> entry file (always loaded) -->
  <line x1="200" y1="90" x2="276" y2="90" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="200" y1="310" x2="236" y2="310" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- entry file -> AGENTS.md (always) -->
  <line x1="420" y1="95" x2="511" y2="180" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="460" y1="305" x2="511" y2="220" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- AGENTS.md -> docs (on demand) -->
  <line x1="677" y1="190" x2="756" y2="112" stroke="#b25400" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#arrowDash)"/>
  <line x1="677" y1="210" x2="736" y2="288" stroke="#b25400" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#arrowDash)"/>

  <!-- ===================== NODES ===================== -->
  <!-- Agents (abgerundet) -->
  <g>
    <rect x="40" y="63" width="160" height="54" rx="14" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="120" y="95" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Claude Code</text>
  </g>
  <g>
    <rect x="40" y="283" width="160" height="54" rx="14" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="120" y="315" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Cursor AI</text>
  </g>

  <!-- Files (eckig) -->
  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <rect x="280" y="70" width="140" height="40" rx="2" fill="#f5f5f5" stroke="#616161"/>
    <text x="350" y="95" text-anchor="middle" fill="#111">CLAUDE.md</text>

    <rect x="240" y="290" width="220" height="40" rx="2" fill="#f5f5f5" stroke="#616161"/>
    <text x="350" y="315" text-anchor="middle" fill="#111">.cursor/rules/cursor.mdc</text>

    <!-- AGENTS.md = central source of truth -->
    <rect x="515" y="176" width="160" height="48" rx="2" fill="#fff3e0" stroke="#b25400" stroke-width="2"/>
    <text x="595" y="205" text-anchor="middle" fill="#111" font-weight="bold">AGENTS.md</text>

    <rect x="760" y="90" width="295" height="40" rx="2" fill="#f5f5f5" stroke="#616161"/>
    <text x="907" y="115" text-anchor="middle" fill="#111">docs/architecture-boundaries.md</text>

    <rect x="740" y="270" width="320" height="40" rx="2" fill="#f5f5f5" stroke="#616161"/>
    <text x="900" y="295" text-anchor="middle" fill="#111">docs/architecture-state-management.md</text>
  </g>

  <!-- ===================== EDGE LABELS ===================== -->
  <g font-size="11" font-style="italic" text-anchor="middle"
     style="paint-order:stroke; stroke:#ffffff; stroke-width:3px; stroke-linejoin:round;">
    <text x="455" y="137" fill="#555">&#171;always&#187;</text>
    <text x="475" y="266" fill="#555">&#171;always&#187;</text>
    <text x="716" y="147" fill="#b25400">&#171;on demand&#187;</text>
    <text x="706" y="245" fill="#b25400">&#171;on demand&#187;</text>
  </g>
</svg>
