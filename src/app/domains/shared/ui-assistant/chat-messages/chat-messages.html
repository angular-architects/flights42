<article class="msg assistant">
  <div class="avatar">🤖</div>
  <div>
    <div class="bubble">
      <app-message data="Hi! How can I help you?"></app-message>
    </div>
    <div class="meta"></div>
  </div>
</article>

@for (message of messageModels(); track message.id) {
  <article
    class="msg"
    [class.assistant]="message.role === 'assistant'"
    [class.user]="message.role === 'user'"
    [class.error]="message.role === 'error'">
    <div class="avatar">{{ message.icon }}</div>
    <div>
      <div class="bubble">
        <!--
        TODO: If we have message.contentString, display it 
        with the app-message component 
        -->

        <!--
        TODO: Display each widget in message.widgets using
        the app-widget-container component
        -->

        <!--
        TODO: Display the name of each tool call in 
        message.toolCalls in a div
        -->
      </div>
      <div class="meta"></div>
    </div>
  </article>
}

@if (showIndicator()) {
  <article class="msg assistant">
    <div class="avatar">🤖</div>
    <div>
      <div class="bubble">
        <div class="ai-wait-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </article>
}
