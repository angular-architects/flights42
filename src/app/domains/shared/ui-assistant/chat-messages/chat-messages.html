<article class="msg assistant">
  <div class="avatar">🤖</div>
  <div>
    <div class="bubble">
      <markdown [data]="greeting()"></markdown>
    </div>
    <div class="meta"></div>
  </div>
</article>

@for (view of views(); track view.id) {
  <!--

  message bubble using the copilot-render-tool-calls component
  (this is also how widgets like the flight cards are rendered)
  -->
}

@for (interrupt of interrupts(); track interrupt.id) {
  <article class="msg assistant">
    <div class="avatar">🤖</div>
    <div>
      <div class="bubble">
        <p class="interrupt-message">{{ interrupt.message }}</p>
        <div class="interrupt-actions">
          @for (option of interrupt.options; track option.id) {
            <button
              type="button"
              class="btn btn-default"
              (click)="resolveInterrupt(interrupt.id, option.payload)">
              {{ option.label }}
            </button>
          }
        </div>
      </div>
      <div class="meta"></div>
    </div>
  </article>
}

@if (pending()) {
  <article class="msg assistant">
    <div class="avatar">🤖</div>
    <div>
      <div class="bubble">
        <div class="ai-wait-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </article>
}
