<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="745" viewBox="0 0 1320 745" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowRead" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d47a1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="745" fill="#ffffff"/>

  <text x="660" y="38" text-anchor="middle" fill="#333" font-size="16" font-weight="bold"
        font-family="Menlo, Consolas, monospace">npm run sync:agent-config</text>

  <!-- ===================== EDGES: source -> generated (copy) ===================== -->
  <line x1="1108" y1="170" x2="519" y2="115" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1108" y1="245" x2="519" y2="175" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1108" y1="245" x2="519" y2="435" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===================== EDGES: agent -> generated (reads) ===================== -->
  <line x1="180" y1="146" x2="236" y2="160" stroke="#0d47a1" stroke-width="1.8" marker-end="url(#arrowRead)"/>
  <line x1="180" y1="456" x2="236" y2="455" stroke="#0d47a1" stroke-width="1.8" marker-end="url(#arrowRead)"/>

  <!-- ===================== EDGES: hooks indirection (runs / delegates) ===================== -->
  <line x1="516" y1="235" x2="616" y2="600" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="516" y1="490" x2="616" y2="668" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="850" y1="602" x2="946" y2="620" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="850" y1="670" x2="946" y2="642" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===================== AGENTS (far left) ===================== -->
  <g>
    <rect x="30" y="120" width="150" height="52" rx="14" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="105" y="152" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Claude Code</text>
  </g>
  <g>
    <rect x="30" y="430" width="150" height="52" rx="14" fill="#00897b" stroke="#00695c" stroke-width="2"/>
    <text x="105" y="462" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Cursor AI</text>
  </g>

  <!-- ===================== GENERATED + PER-PLATFORM CONFIG (grouped per agent) ===================== -->
  <rect x="240" y="80" width="290" height="190" rx="10" fill="#eef4fc" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="240" y="400" width="290" height="130" rx="10" fill="#e7f5f3" stroke="#00897b" stroke-width="1.5"/>

  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <rect x="255" y="95" width="260" height="40" rx="2" fill="#ffffff" stroke="#616161"/>
    <text x="385" y="120" text-anchor="middle" fill="#111">.claude/skills/</text>

    <rect x="255" y="155" width="260" height="40" rx="2" fill="#ffffff" stroke="#616161"/>
    <text x="385" y="180" text-anchor="middle" fill="#111">.mcp.json</text>

    <rect x="255" y="215" width="260" height="40" rx="2" fill="#fffbf0" stroke="#616161" stroke-dasharray="5,3"/>
    <text x="385" y="240" text-anchor="middle" fill="#111">.claude/settings.json</text>

    <rect x="255" y="415" width="260" height="40" rx="2" fill="#ffffff" stroke="#616161"/>
    <text x="385" y="440" text-anchor="middle" fill="#111">.cursor/mcp.json</text>

    <rect x="255" y="470" width="260" height="40" rx="2" fill="#fffbf0" stroke="#616161" stroke-dasharray="5,3"/>
    <text x="385" y="495" text-anchor="middle" fill="#111">.cursor/hooks.json</text>
  </g>

  <!-- ===================== SOURCE (.agents) ===================== -->
  <rect x="1090" y="110" width="200" height="190" rx="12" fill="#fff8f0" stroke="#b25400" stroke-width="1.5"/>
  <text x="1190" y="134" text-anchor="middle" fill="#b25400" font-size="13" font-weight="bold">.agents/  &#171;source&#187;</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <rect x="1110" y="150" width="160" height="40" rx="2" fill="#fff3e0" stroke="#b25400"/>
    <text x="1190" y="175" text-anchor="middle" fill="#111">skills/</text>

    <rect x="1110" y="225" width="160" height="40" rx="2" fill="#fff3e0" stroke="#b25400"/>
    <text x="1190" y="250" text-anchor="middle" fill="#111">mcp.json</text>
  </g>

  <!-- ===================== HOOK INDIRECTION (provider-specific -> shared) ===================== -->
  <text x="735" y="558" text-anchor="middle" fill="#777" font-size="12" font-style="italic">&#171; provider-specific &#187;</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <rect x="616" y="580" width="234" height="44" rx="2" fill="#ffffff" stroke="#1565c0" stroke-width="1.8"/>
    <text x="733" y="607" text-anchor="middle" fill="#111">claude-stop-hook.mjs</text>

    <rect x="616" y="648" width="234" height="44" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.8"/>
    <text x="733" y="675" text-anchor="middle" fill="#111">cursor-stop-hook.mjs</text>

    <rect x="946" y="606" width="250" height="50" rx="2" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
    <text x="1071" y="626" text-anchor="middle" fill="#111" font-weight="bold">run-checks.mjs</text>
    <text x="1071" y="644" text-anchor="middle" fill="#2e7d32" font-size="11" font-style="italic" font-family="Helvetica, Arial, sans-serif">&#171; shared / general &#187;</text>
  </g>

  <!-- ===================== EDGE LABELS ===================== -->
  <g font-size="11" font-style="italic" text-anchor="middle"
     style="paint-order:stroke; stroke:#ffffff; stroke-width:3px; stroke-linejoin:round;">
    <text x="812" y="129" fill="#555">copy</text>
    <text x="812" y="199" fill="#555">copy</text>
    <text x="838" y="338" fill="#555">copy</text>
    <text x="206" y="142" fill="#0d47a1">reads</text>
    <text x="206" y="450" fill="#0d47a1">reads</text>
    <text x="556" y="430" fill="#555">runs</text>
    <text x="556" y="585" fill="#555">runs</text>
    <text x="898" y="612" fill="#555">delegates</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="12" font-family="Helvetica, Arial, sans-serif">
    <rect x="240" y="712" width="22" height="14" fill="#ffffff" stroke="#616161"/>
    <text x="270" y="723" fill="#555">generated by sync</text>
    <rect x="430" y="712" width="22" height="14" fill="#fffbf0" stroke="#616161" stroke-dasharray="5,3"/>
    <text x="460" y="723" fill="#555">hand-authored per platform &#8212; not synced</text>
  </g>
</svg>
