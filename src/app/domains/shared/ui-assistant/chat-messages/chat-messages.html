<article class="msg assistant">
  <div class="avatar">🤖</div>
  <div>
    <div class="bubble">
      <markdown [data]="greeting()"></markdown>
    </div>
    <div class="meta"></div>
  </div>
</article>

@for (view of views(); track view.id) {
  @if (view.text) {
    <article class="msg {{ view.variant }}">
      <div class="avatar">{{ view.avatar }}</div>
      <div>
        <div class="bubble">
          <markdown [data]="view.text"></markdown>
        </div>
        <div class="meta"></div>
      </div>
    </article>
  }

  @for (call of view.toolCalls; track call.id) {
    <article class="msg {{ view.variant }}">
      <div class="avatar">{{ view.avatar }}</div>
      <div>
        <div class="bubble">
          <copilot-render-tool-calls
            [message]="call.message"
            [messages]="messages()"
            [agentId]="agentId()"
            [isLoading]="pending()" />
        </div>
        <div class="meta"></div>
      </div>
    </article>
  }

  @if (view.activity) {
    @let activity = view.activity;
    <article class="msg {{ view.variant }}">
      <div class="avatar">{{ view.avatar }}</div>
      <div>
        <div class="bubble" [class.bubble--a2ui]="activity.isSurface">
          <app-copilot-activity
            [message]="activity.message"
            [agentId]="agentId()" />
        </div>
        <div class="meta"></div>
      </div>
    </article>
  }
}

@if (pending()) {
  <article class="msg assistant">
    <div class="avatar">🤖</div>
    <div>
      <div class="bubble">
        <div class="ai-wait-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </article>
}
